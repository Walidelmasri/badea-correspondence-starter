<main class="login-page">
  <section
    class="login-card"
    aria-labelledby="login-heading"
    [attr.aria-busy]="isBusy()"
  >
    <div class="login-card__topbar">
      <img class="login-card__logo"
        [src]="translation.language() === 'ar' ? 'branding/badea-ar.png' : 'branding/badea-en.jpg'"
        [alt]="translation.language() === 'ar' ? 'المصرف العربي للتنمية الاقتصادية في أفريقيا' : 'Arab Bank for Economic Development in Africa'"
        width="176" height="65" />

      <button
        class="login-card__language"
        type="button"
        (click)="toggleLanguage()"
      >
        @if (
          translation.language() === 'ar'
        ) {
          EN
        } @else {
          عربي
        }
      </button>
    </div>

    @if (isBusy()) {
      <div
        class="login-loading"
        role="status"
        aria-live="polite"
      >
        <span
          class="login-loading__spinner"
          aria-hidden="true"
        ></span>

        <strong>
          {{
            translation.text()
              .auth.signingIn
          }}
        </strong>
      </div>
    } @else {
      <div class="login-card__heading">
        <span class="login-card__eyebrow">
          {{
            translation.text()
              .auth.eyebrow
          }}
        </span>

        <h1 id="login-heading">
          {{
            translation.text()
              .auth.title
          }}
        </h1>

        <p>
          {{
            translation.text()
              .auth.description
          }}
        </p>
      </div>

      <form
        class="login-form"
        [formGroup]="form"
        (ngSubmit)="submit()"
      >
        <label class="login-field">
          <span>
            {{
              translation.text()
                .auth.username
            }}
          </span>

          <input
            type="text"
            formControlName="userId"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            [placeholder]="
              translation.text()
                .auth.usernamePlaceholder
            "
          />
        </label>

        <label class="login-field">
          <span>
            {{
              translation.text()
                .auth.password
            }}
          </span>

          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            [placeholder]="
              translation.text()
                .auth.passwordPlaceholder
            "
          />
        </label>

        @if (
          errorMessage();
          as error
        ) {
          <div
            class="login-form__error"
            role="alert"
          >
            {{ error }}
          </div>
        }

        <button
          class="login-form__submit"
          type="submit"
        >
          {{
            translation.text()
              .auth.signIn
          }}
        </button>
      </form>
    }
  </section>
</main>
