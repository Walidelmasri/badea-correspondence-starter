<section class="inbox-page">
  <header class="inbox-page__header">
    <div>
      <span class="inbox-page__eyebrow">مساحة العمل</span>

      <h1>الوارد</h1>

      <p>
        المراسلات والوثائق الواردة إليك
      </p>
    </div>

    <button
      class="inbox-page__new"
      type="button"
    >
      مراسلة جديدة
    </button>
  </header>

  <div class="inbox-page__toolbar">
    <label class="inbox-search">
      <span class="visually-hidden">
        البحث في المراسلات
      </span>

      <input
        type="search"
        placeholder="بحث بالموضوع، المرسل أو رقم الوثيقة"
      />
    </label>
  </div>

  <div class="inbox-workspace">
    <section
      class="inbox-workspace__list"
      aria-label="قائمة المراسلات"
    >
      <div class="inbox-workspace__empty">
        <strong>لا توجد مراسلات حالياً</strong>

        <span>
          ستظهر المراسلات الواردة هنا.
        </span>
      </div>
    </section>

    <section
      class="inbox-workspace__detail"
      aria-label="تفاصيل المراسلة"
    >
      <div class="inbox-workspace__placeholder">
        <div
          class="inbox-workspace__placeholder-icon"
          aria-hidden="true"
        >
          ◇
        </div>

        <strong>
          اختر مراسلة لعرضها
        </strong>

        <span>
          ستظهر تفاصيل الوثيقة والإجراء المطلوب هنا.
        </span>
      </div>
    </section>
  </div>
</section>
