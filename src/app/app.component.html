<div class="app-shell">
  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__brand-name">
        BADEA
      </span>

      <div class="app-header__title">
        <strong>
          {{ translation.text().app.name }}
        </strong>

        <span>
          {{ translation.text().app.nameEnglish }}
        </span>
      </div>
    </div>

    <div class="app-header__actions">
      <button
        class="app-header__language"
        type="button"
        (click)="toggleLanguage()"
      >
        @if (translation.language() === 'ar') {
          EN
        } @else {
          عربي
        }
      </button>

      <div class="app-header__user">
        <div class="app-header__user-text">
          <strong>Walid Salem</strong>

          <span>
            {{ translation.text().user.office }}
          </span>
        </div>

        <div
          class="app-header__avatar"
          aria-hidden="true"
        >
          WS
        </div>
      </div>
    </div>
  </header>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
