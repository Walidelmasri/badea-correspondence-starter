server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    /*
     * Same-origin gateway to Alfresco.
     *
     * The browser will eventually be able to call:
     *
     *   /alfresco/...
     *
     * instead of knowing anything about Docker,
     * internal IPs or Alfresco's container port.
     */
    location /alfresco/ {
        proxy_pass http://alfresco:8080/alfresco/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        try_files $uri =404;

        expires 1h;
        add_header Cache-Control "public";
    }
}