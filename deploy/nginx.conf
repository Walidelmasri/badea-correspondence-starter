server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Same-origin gateway to Alfresco.
    # The correspondence container and Alfresco are both
    # attached to the alfresco_default Docker network.
    location /alfresco/ {
        proxy_pass http://alfresco:8080/alfresco/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Alfresco returns a Basic authentication challenge
        # on 401 responses.
        #
        # Do not allow the browser to open its native
        # username/password popup. Angular owns the login UI.
        proxy_hide_header WWW-Authenticate;
    }

    # Angular entry point should never be cached aggressively.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # PDF.js ES modules.
    # Browsers reject .mjs files when served as application/octet-stream.
    location ~* \.mjs$ {
        default_type application/javascript;

        try_files $uri =404;

        expires 1h;
        add_header Cache-Control "public";
    }

    # PDF.js / browser WebAssembly assets.
    location ~* \.wasm$ {
        default_type application/wasm;

        try_files $uri =404;

        expires 1h;
        add_header Cache-Control "public";
    }

    # Static application assets.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        try_files $uri =404;

        expires 1h;
        add_header Cache-Control "public";
    }

    # Angular SPA routing.
    # Direct navigation/refresh of /president-review must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}