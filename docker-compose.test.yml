name: badea-correspondence-test

services:
  correspondence:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: badea-correspondence-test

    restart: unless-stopped

    ports:
      # HTTPS is terminated by the existing alfresco-proxy-1 on Docker network.
      # Never publish login credentials or correspondence tickets over plaintext LAN HTTP.
      - "127.0.0.1:8086:80"

    networks:
      - alfresco

networks:
  alfresco:
    external: true
    name: alfresco_default