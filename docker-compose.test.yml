name: badea-correspondence-test

services:
  correspondence:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: badea-correspondence-test

    restart: unless-stopped

    ports:
      - "8086:80"

    volumes:
      - ./runtime-test-data/report-badea.pdf:/usr/share/nginx/html/pdf/local/report-badea.pdf:ro

    networks:
      - alfresco

networks:
  alfresco:
    external: true
    name: alfresco_default